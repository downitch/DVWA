name: Semgrep SAST

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  # Allows manual runs from the Actions tab
  workflow_dispatch:

jobs:
  semgrep:
    name: Scan Code
    runs-on: ubuntu-latest

    # Optional: Needed if you want to upload results to GitHub Security Tab (Code Scanning)
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          # Uses Semgrep's default, community-curated rulesets (OWASP Top 10, security audit)
          config: >-
            p/default
            p/security-audit

      # Optional: Upload results to GitHub Security tab (SARIF format)
      # Requires GitHub Advanced Security for private repos, free for public repos
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
